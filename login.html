<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEPMS - Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- ================= HEADER ================= -->

            <div class="header">

                <h1>SEPMS</h1>

                <p>
                    Student Exchange Program Management System
                </p>

            </div>


            <!-- ================= LOGIN TITLE ================= -->

            <h2>Login</h2>


            <!-- ================= LOGIN FORM ================= -->

            <form>

                <table>

                    <!-- Username / User ID -->

                    <tr>

                        <td>
                            <label for="username">
                                Username or User ID
                            </label>
                        </td>

                        <td>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter username or user ID"
                                autocomplete="username"
                            >

                        </td>

                    </tr>


                    <!-- Password -->

                    <tr>

                        <td>
                            <label for="password">
                                Password
                            </label>
                        </td>

                        <td>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                        </td>

                    </tr>


                    <!-- Forgot Password -->

                    <tr>

                        <td colspan="2">

                            <div class="forgot-password">

                                <a href="forgot_password.html">
                                    Forgot Password?
                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- Login and Cancel -->

                    <tr>

                        <td colspan="2">

                            <div class="button-area">

                                <button
                                    type="submit"
                                    class="login-btn"
                                >
                                    Login
                                </button>


                                <button
                                    type="reset"
                                    class="cancel-btn"
                                >
                                    Cancel
                                </button>

                            </div>

                        </td>

                    </tr>

                </table>

            </form>


            <!-- ================= REGISTER LINK ================= -->

            <div class="register-link">

                <span>Don't have an account?</span>

                <a href="register.html">
                    Create an Account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
